# Offline checks only. This workflow references no secret and never contacts PayPal.
# Sandbox tests (owner-run, tools/spike-kit and the sandbox conformance run) NEVER run in CI:
# they need credentials that exist only in the owner's local env file.
#
# Lane 17 shape: lint-type, tests and checks run on every pull request; mutation and bundle are
# manual (workflow_dispatch) because they are slow. Nothing here ships or uploads anything.
#
# TODO (dependency request, lane 17): branch coverage gate on money modules (MAINT-6, 90 percent)
# needs @vitest/coverage-v8, which is not on the D-4 list. Add a `coverage` step once approved.
# SUP-6: the `gitleaks` job scans the full history on every pull request (CI-3). It builds gitleaks
# with `go install` at a pinned version; the Go module proxy checks it against the public checksum
# database, so only GitHub's own actions and no token are involved.
# TODO(pin): actions are pinned by tag (v4). Pin each to a full commit SHA once it can be verified
# against the upstream repository, which is not possible offline. Verification step, per action:
#   git ls-remote https://github.com/actions/checkout refs/tags/v4 refs/tags/v4^{}
#   git ls-remote https://github.com/actions/setup-node refs/tags/v4 refs/tags/v4^{}
#   git ls-remote https://github.com/actions/setup-go refs/tags/v5 refs/tags/v5^{}
# Take the dereferenced (^{}) SHA when present, replace `@v4` with `@<sha> # v4`, and re-run CI.
name: ci

# TEST-TIERS: a manual run picks a tier (docs/TESTING.md). `gate` runs the integrated critical pack from
# tests/gate.json in parallel jobs (test shards plus the browser specs and trace:verify) beside the
# jobs below that always run (lint-type, checks, postgres, gitleaks, which are the gate's static part).
# `full` keeps today's six shards, mutation and bundle. A pull request runs the same jobs as before
# (full); only a manual run can choose the gate. The gate adds one download: the Playwright browser.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier for a manual run: gate (critical pack, minutes) or full (every suite)'
        type: choice
        options:
          - gate
          - full
        default: gate

permissions:
  contents: read

jobs:
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # The six suites take over 20 minutes on one 2-core runner (restore and C-11 alone take about 4), so
  # every PR was cancelled at the timeout with all tests passing. Shards by file, each with room. Four
  # shards reached 25 of 30 minutes once the journal (TR0) landed, so there are six. Add shards; do not
  # raise the timeout.
  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/6

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:isolation
      - run: pnpm check:no-live-host
      - run: pnpm check:secrets-names
      - run: pnpm check:fixtures
      - run: pnpm check:routes
      - run: pnpm check:openapi
      - run: pnpm check:hosting
      - run: pnpm check:hosting-gcp
      - run: pnpm check:licences
      - run: pnpm check:business-rules
      - run: pnpm check:provenance
      # SUP-2: zero high or critical in production dependencies, or a dated waiver in the gate report.
      - run: pnpm audit --prod

  # T3 gate (manual run, tier gate): the critical vitest pack of tests/gate.json in four shards. The shard
  # count here must equal "shards" in tests/gate.json.
  gate-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-tier.mjs --tier gate --group tests --shard ${{ matrix.shard }}/4

  # T3 gate: the key browser specs on the dry run (offline, localhost only), then trace:verify on the
  # journal they wrote. Build, specs and verify run in order inside the script.
  gate-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @umsbx/web exec playwright install --with-deps chromium
      - run: node scripts/test-tier.mjs --tier gate --group e2e

  # Real-Postgres suites (PG-2: races, locks, sessions, boot) skip without UMS_TEST_PG_BIN. The runner
  # image ships PostgreSQL; each suite starts its own throwaway cluster from these binaries on a local
  # socket. No network, no secret, no PayPal.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: echo "UMS_TEST_PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      # Without the binaries every suite would skip and the job would pass with nothing tested.
      - run: test -x "$UMS_TEST_PG_BIN/initdb"
      - run: pnpm vitest run --maxWorkers=2 pg. postgres mvp-c-pg migration-0017

  # Secret scan of the full history with the repository's .gitleaks.toml and .gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: '"$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --exit-code 1 .'

  mutation:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation

  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Synthetic canary values (no real secret) become the build environment; the scan then proves
      # none of them reached a client or server chunk (A-25).
      - run: node scripts/check-bundle-secrets.mjs --print-env >> "$GITHUB_ENV"
      - run: pnpm --filter @umsbx/web --if-present build
      - run: pnpm check:bundle
