# Fixed, non-secret environment values for the Cloud Run service (GCP-1, D-049). deploy.sh passes this
# file to "gcloud run deploy --env-vars-file". It is a flat map of quoted strings. Secret values are
# NOT here: deploy.sh maps them from Secret Manager by name (--set-secrets), and
# "node scripts/check-hosting-gcp.mjs" (pnpm check:hosting-gcp) fails if a secret name or value
# shows up in this file. The secret names are the ones in infra/gcp/set-secret.sh, plus DATABASE_URL.
#
# UMS_PAYPAL_CONNECT is on here (OPS-SW, D-120), so no gcloud step is needed per sitting. It lets no
# PayPal call out by itself: each call still needs an active approval row, opened on Operations Controls
# by an operator with the authenticator code (D-094 ceiling fixed in code, at most four hours), and the
# paypal_outbound switch turned on with Start. Stop, cloud:down and the approval's end each stop calls.
NODE_ENV: 'production'
NEXT_TELEMETRY_DISABLED: '1'
UMS_MODE: 'sandbox'
UMS_PAYPAL_CONNECT: 'on'
UMS_OUTBOUND_SCOPE: 'mvp_c_refunds'
UMS_DB: 'postgres'
# Two proxies append to X-Forwarded-For: the load balancer and Cloud Run's front end (DOM-1). Measured
# by the owner curl test through the custom domain on 10 Nov 2026; a wrong count is worse than 0.
UMS_TRUSTED_PROXIES: '2'
NEXT_PUBLIC_UMS_ENV_LABEL: 'Sandbox'
# Not a secret. The one address browsers use: the custom domain (DOM-1), no trailing slash. A load
# balancer routes it to the service (docs/owner/CUSTOM-DOMAIN.md). Deploy this only after
# https://unitmarket.live/signin answers; before DOM-1 it was the Cloud Run service URL.
UMS_PUBLIC_ORIGIN: 'https://unitmarket.live'
